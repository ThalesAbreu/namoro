<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Importante 💖</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffe5ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }
        .botoes {
            display: flex;
            gap: 20px;
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100px;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #sim {
            background-color: #ff7096;
            color: white;
        }
        #nao {
            background-color: #fb6f92;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <h1>Quer namorar comigo? 🥰</h1>

    <div class="botoes">
        <button id="sim" onclick="aceitou()">SIM</button>
        <button id="nao" onmouseover="foge()" onclick="foge()">NÃO</button>
    </div>

    <script>
        function foge() {
            const botaoNao = document.getElementById("nao");
            
            // Calcula posições aleatórias na tela livre
            const larguraJanela = window.innerWidth - 100;
            const alturaJanela = window.innerHeight - 100;
            
            const novoX = Math.random() * larguraJanela;
            const novoY = Math.random() * alturaJanela;
            
            // Move o botão
            botaoNao.style.left = novoX + "px";
            botaoNao.style.top = novoY + "px";
        }

        function aceitou() {
            alert("Sabia que você ia aceitar! Te amo! 💖💍");
            // Se quiser, mude o link abaixo para um vídeo de vocês ou uma foto
            // window.location.href = "https://seulinkaqui.com"; 
        }
    </script>

</body>
</html>
